name: Apply Cynthia Drag Race Repair

on:
  push:
    branches:
      - work/cynthia-drag-race-repair
    paths:
      - .github/workflows/cynthia-drag-race-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/cynthia-drag-race-repair
          fetch-depth: 0
      - name: Verify exact repair preconditions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1d6f02d35f964d2a8a2c29a890507a7aabfe5287"
          test "$(git rev-parse HEAD:src/MoticosMerge.jsx)" = "ce6950bb879e408a8486e64db83bdfc0bdbb96b9"
      - name: Apply synchronous drag-state repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/MoticosMerge.jsx')
          text = path.read_text()

          anchor = '  const timersRef = useRef(new Set());\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + '  const dragRef = useRef(null);\n')

          reset_anchor = '    setPrevState(null);\n    setDrag(null);\n    setFlying(null);'
          assert text.count(reset_anchor) == 1
          text = text.replace(
              reset_anchor,
              '    setPrevState(null);\n    dragRef.current = null;\n    setDrag(null);\n    setFlying(null);'
          )

          down_start = text.index('  function handlePointerDown(event, index) {')
          move_start = text.index('  function handlePointerMove(event) {', down_start)
          down = text[down_start:move_start]
          assert down.count('    setDrag({') == 1
          down = down.replace('    setDrag({', '    setActiveDrag({')
          helpers = '''  function setActiveDrag(next) {
            dragRef.current = next;
            setDrag(next);
          }

          function cancelDrag() {
            setActiveDrag(null);
          }

          '''
          text = text[:down_start] + helpers + down + text[move_start:]

          move_start = text.index('  function handlePointerMove(event) {')
          up_start = text.index('  function handlePointerUp(event) {', move_start)
          move = '''  function handlePointerMove(event) {
            const current = dragRef.current;
            if (!current || current.pointerId !== event.pointerId || current.snapBack) {
              return;
            }

            const rawX = event.clientX;
            const rawY = event.clientY;
            const dx = rawX - current.startX;
            const dy = rawY - current.startY;
            const dragging = current.dragging || Math.hypot(dx, dy) > 6;
            let next;

            if (!dragging) {
              next = { ...current, rawX, rawY, x: rawX, y: rawY, dragging };
            } else {
              const magnetic = findMagneticTarget(rawX, rawY, current.index);
              if (!magnetic) {
                next = {
                  ...current,
                  rawX,
                  rawY,
                  x: rawX,
                  y: rawY,
                  dragging,
                  magneticIndex: null,
                };
              } else {
                const closeness = 1 - magnetic.distance / magnetic.radius;
                const pull = 0.28 + closeness * 0.34;
                next = {
                  ...current,
                  rawX,
                  rawY,
                  x: rawX + (magnetic.center.x - rawX) * pull,
                  y: rawY + (magnetic.center.y - rawY) * pull,
                  dragging,
                  magneticIndex: magnetic.index,
                };
              }
            }

            setActiveDrag(next);
          }

          '''
          text = text[:move_start] + move + text[up_start:]

          up_start = text.index('  function handlePointerUp(event) {')
          undo_start = text.index('  function handleUndo() {', up_start)
          old_up = text[up_start:undo_start]
          schedule_start = old_up.index('    requestAnimationFrame(() => {')
          tail = old_up[schedule_start:]
          tail = tail.replace('    setDrag(null);\n\n    requestAnimationFrame', '    cancelDrag();\n\n    requestAnimationFrame')
          new_prefix = '''  function handlePointerUp(event) {
            const activeDrag = dragRef.current;
            if (!activeDrag || activeDrag.pointerId !== event.pointerId) {
              cancelDrag();
              return;
            }
            if (!activeDrag.dragging) {
              cancelDrag();
              return;
            }

            const directTargetIndex = findCellAtPoint(event.clientX, event.clientY);
            const magnetic = findMagneticTarget(event.clientX, event.clientY, activeDrag.index);
            const targetIndex = magnetic?.index ?? directTargetIndex;
            const fromTier = board[activeDrag.index]?.tier;
            const valid =
              targetIndex !== -1 &&
              targetIndex !== activeDrag.index &&
              board[targetIndex]?.tier === fromTier;

            if (!valid) {
              const origin = cellCenter(activeDrag.index);
              if (!origin) {
                cancelDrag();
                return;
              }
              if (
                targetIndex !== -1 &&
                board[targetIndex] &&
                board[targetIndex].tier !== fromTier
              ) {
                playDenied();
              }
              setActiveDrag({ ...activeDrag, snapBack: true, x: origin.x, y: origin.y });
              schedule(cancelDrag, 170);
              return;
            }

            const target = cellCenter(targetIndex);
            if (!target) {
              cancelDrag();
              return;
            }

            const fromIndex = activeDrag.index;
            const boardSnapshot = board.slice();
            const residueSnapshot = residue.slice();
            const scoreSnapshot = score;
            const mergesSnapshot = merges;
            const highestSnapshot = highest;
            const cutsSnapshot = cutsLeft;
            const keepsakesSnapshot = keepsakes;
            const keepsakeArmedSnapshot = keepsakeArmed;

            setFlying({
              from: fromIndex,
              to: targetIndex,
              tile: board[fromIndex],
              x: activeDrag.x,
              y: activeDrag.y,
              size: activeDrag.size,
            });
            cancelDrag();

          '''
          text = text[:up_start] + new_prefix + tail + text[undo_start:]

          cancel_anchor = '          onPointerCancel={() => setDrag(null)}'
          assert text.count(cancel_anchor) == 1
          text = text.replace(cancel_anchor, '          onPointerCancel={cancelDrag}')

          assert text.count('const dragRef = useRef(null);') == 1
          assert text.count('function setActiveDrag') == 1
          assert text.count('function handlePointerMove') == 1
          assert text.count('const activeDrag = dragRef.current;') == 1
          assert 'onPointerCancel={() => setDrag(null)}' not in text
          path.write_text(text)
          PY
      - name: Verify source and remove one-use workflow
        run: |
          set -euo pipefail
          grep -q 'const activeDrag = dragRef.current' src/MoticosMerge.jsx
          grep -q 'onPointerCancel={cancelDrag}' src/MoticosMerge.jsx
          git rm .github/workflows/cynthia-drag-race-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/MoticosMerge.jsx
          git commit -m 'Stabilize synchronous drag completion'
          git push origin HEAD:work/cynthia-drag-race-repair
