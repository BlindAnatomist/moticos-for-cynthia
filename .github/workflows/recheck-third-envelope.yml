name: Recheck Riverside browser assertions

# Inert until this separate, explicitly approved verification branch is pushed.
on:
  push:
    branches: [verify/third-envelope-recheck-20261004]

permissions:
  contents: read

concurrency:
  group: moticos-third-envelope-recheck
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify unchanged engines and handlers
        run: npm test
      - name: Build candidate
        run: npm run build
      - name: Install standard WebKit and Chromium browsers
        run: npx playwright install --with-deps webkit chromium
      - name: Recheck six cases after test-only wording and scroll-fixture corrections
        run: npx playwright test tests/e2e/matching-riverside.spec.js tests/e2e/matching.spec.js --grep 'all three chooser cards|a genuinely stale second tab' --workers=2 --retries=0
      - name: Keep review evidence for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moticos-third-envelope-recheck-evidence
          path: |
            test-results/screenshots
            test-results/postcards
            test-results/**/trace.zip
            playwright-report
          if-no-files-found: ignore
          retention-days: 1
