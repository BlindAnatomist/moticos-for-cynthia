name: Apply Cynthia E2E Drag Readiness Repair

on:
  push:
    branches:
      - work/cynthia-e2e-drag-readiness
    paths:
      - .github/workflows/cynthia-e2e-drag-readiness.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/cynthia-e2e-drag-readiness
          fetch-depth: 0
      - name: Verify exact repair preconditions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2044173a0b49efa4efac233ab014022a4ad43500"
          test "$(git rev-parse HEAD:tests/e2e/moticos.spec.js)" = "5cb82fe2d8e07f2027b39934bfa18ae1a559f56f"
      - name: Synchronize repeated drag gestures with rendered readiness
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/moticos.spec.js')
          text = path.read_text()

          old_drag = '''async function dragTile(page, from, to, nearMiss = false) {
            const fromBox = await from.boundingBox();
            const toBox = await to.boundingBox();
            if (!fromBox || !toBox) throw new Error("Unable to locate merge pair.");
            const targetX = toBox.x + toBox.width / 2 + (nearMiss ? toBox.width * 0.62 : 0);
            const targetY = toBox.y + toBox.height / 2;
            await page.mouse.move(fromBox.x + fromBox.width / 2, fromBox.y + fromBox.height / 2);
            await page.mouse.down();
            await page.mouse.move(targetX, targetY, { steps: 10 });
            await page.mouse.up();
          }
          '''.replace('          ', '')

          new_drag = '''async function dragTile(page, from, to, nearMiss = false) {
            const floating = page.locator(".mm-floating-tile");
            await expect(floating).toHaveCount(0);

            const fromBox = await from.boundingBox();
            const toBox = await to.boundingBox();
            if (!fromBox || !toBox) throw new Error("Unable to locate merge pair.");
            const startX = fromBox.x + fromBox.width / 2;
            const startY = fromBox.y + fromBox.height / 2;
            const targetX = toBox.x + toBox.width / 2 + (nearMiss ? toBox.width * 0.62 : 0);
            const targetY = toBox.y + toBox.height / 2;
            const midpointX = startX + (targetX - startX) * 0.55;
            const midpointY = startY + (targetY - startY) * 0.55;

            await page.mouse.move(startX, startY);
            await page.mouse.down();
            await page.mouse.move(midpointX, midpointY, { steps: 4 });
            await page.mouse.move(targetX, targetY, { steps: 8 });
            await expect(floating).toBeVisible();
            await page.mouse.up();
          }
          '''.replace('          ', '')

          assert text.count(old_drag) == 1
          text = text.replace(old_drag, new_drag)

          old_wait = '  await expect(page.getByTestId("merges")).toHaveText(String(expectedMergeCount));\n'
          new_wait = old_wait + '  await expect(page.locator(".mm-floating-tile")).toHaveCount(0);\n'
          assert text.count(old_wait) == 1
          text = text.replace(old_wait, new_wait)

          assert text.count('await expect(floating).toHaveCount(0);') == 1
          assert text.count('await expect(floating).toBeVisible();') == 1
          assert text.count('await expect(page.locator(".mm-floating-tile")).toHaveCount(0);') == 1
          path.write_text(text)
          PY
      - name: Verify test synchronization and remove one-use workflow
        run: |
          set -euo pipefail
          grep -q 'await expect(floating).toBeVisible();' tests/e2e/moticos.spec.js
          grep -q 'midpointX' tests/e2e/moticos.spec.js
          git rm .github/workflows/cynthia-e2e-drag-readiness.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/moticos.spec.js
          git commit -m 'Synchronize browser drag readiness'
          git push origin HEAD:work/cynthia-e2e-drag-readiness
