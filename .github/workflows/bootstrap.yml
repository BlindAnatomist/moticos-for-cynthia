name: Bootstrap Moticos Source

on:
  push:
    branches:
      - work/fresh-moticos-playable

permissions:
  contents: write

concurrency:
  group: moticos-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unpack:
    if: ${{ hashFiles('.bootstrap/chunk-00') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@v4

      - name: Reconstruct and verify project archive
        shell: bash
        run: |
          cat .bootstrap/chunk-* > /tmp/moticos.zip.b64
          base64 --decode /tmp/moticos.zip.b64 > /tmp/moticos.zip
          echo "7d50f28818894caadff77176a4a99925098719fb02bfd198e0a52e10d1e7395d  /tmp/moticos.zip" | sha256sum --check --strict
          unzip -oq /tmp/moticos.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit exact reconstructed source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add fresh Moticos playable and tests"
          git push
