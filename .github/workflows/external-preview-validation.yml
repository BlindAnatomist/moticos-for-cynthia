name: External Preview Validation

on:
  push:
    branches:
      - work/fresh-moticos-playable
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: moticos-external-preview-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser tooling
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Test no-settings preview candidates
        env:
          GITHUB_PAGES_URL: https://blindanatomist.github.io/moticos-for-cynthia/
          GITHACK_CDN_URL: https://rawcdn.githack.com/BlindAnatomist/moticos-for-cynthia/010878bbf253559f29097f2c69c9d902d6a3664b/index.html
          GITHACK_DEV_URL: https://raw.githack.com/BlindAnatomist/moticos-for-cynthia/gh-pages/index.html
          STATICDELIVR_URL: https://cdn.staticdelivr.com/gh/BlindAnatomist/moticos-for-cynthia/gh-pages/index.html
          JSDELIVR_URL: https://cdn.jsdelivr.net/gh/BlindAnatomist/moticos-for-cynthia@gh-pages/index.html
          STACKBLITZ_URL: https://stackblitz.com/github/BlindAnatomist/moticos-for-cynthia/tree/work/fresh-moticos-playable?embed=1&view=preview&hideExplorer=1&hideNavigation=1&hidedevtools=1&startScript=dev
        run: |
          mkdir -p test-results/external-previews
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs/promises';

          const candidates = [
            ['github-pages', process.env.GITHUB_PAGES_URL],
            ['githack-cdn', process.env.GITHACK_CDN_URL],
            ['githack-dev', process.env.GITHACK_DEV_URL],
            ['staticdelivr', process.env.STATICDELIVR_URL],
            ['jsdelivr', process.env.JSDELIVR_URL],
            ['stackblitz', process.env.STACKBLITZ_URL],
          ];

          const browser = await chromium.launch();
          const results = [];
          for (const [name, url] of candidates) {
            const context = await browser.newContext({ viewport: { width: 430, height: 932 } });
            const page = await context.newPage();
            const errors = [];
            page.on('console', msg => {
              if (msg.type() === 'error') errors.push(`console: ${msg.text()}`);
            });
            page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
            let status = null;
            let title = '';
            let moticosVisible = false;
            let urlAfter = '';
            try {
              const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 90000 });
              status = response?.status() ?? null;
              await page.waitForTimeout(name === 'stackblitz' ? 45000 : 5000);
              title = await page.title();
              urlAfter = page.url();
              moticosVisible = await page.getByText('MOTICOS', { exact: true }).first().isVisible().catch(() => false);
              if (!moticosVisible && name === 'stackblitz') {
                for (const frame of page.frames()) {
                  const visible = await frame.getByText('MOTICOS', { exact: true }).first().isVisible().catch(() => false);
                  if (visible) {
                    moticosVisible = true;
                    break;
                  }
                }
              }
              await page.screenshot({
                path: `test-results/external-previews/${name}.png`,
                fullPage: true,
              });
            } catch (error) {
              errors.push(`navigation: ${error.message}`);
            }
            results.push({ name, url, status, title, moticosVisible, urlAfter, errors });
            await context.close();
          }
          await browser.close();
          await fs.writeFile('test-results/external-previews/results.json', JSON.stringify(results, null, 2));
          console.log(JSON.stringify(results, null, 2));
          if (!results.some(result => result.moticosVisible)) {
            process.exitCode = 1;
          }
          NODE

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moticos-external-preview-validation
          path: test-results/external-previews
          if-no-files-found: error
          retention-days: 1
