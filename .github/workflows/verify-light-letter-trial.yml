name: Verify the Light Letter trial

on:
  push:
    branches: [verify/light-letter-trial-20261005]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: moticos-light-letter-trial-20261005
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Record the bounded job budget
        run: echo "MOTICOS_JOB_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        id: checkout
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact dependencies
        timeout-minutes: 3
        run: npm ci --no-audit --no-fund
      - name: Check local logic, both builds, and exact trial collection
        timeout-minutes: 3
        run: |
          mkdir -p evidence/light-letter preflight-results
          npm test 2>&1 | tee preflight-results/unit.log
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_preserve_evidence.py 2>&1 | tee preflight-results/packaging-unit.log
          npm run build 2>&1 | tee preflight-results/build-normal.log
          npm run build:trial 2>&1 | tee preflight-results/build-trial.log
          npm run validate:trial-build 2>&1 | tee preflight-results/build-isolation.log
          cp dist-trial/trial-manifest.json preflight-results/trial-manifest.json
          npx playwright test --config=playwright.trial.config.js --list --reporter=json > preflight-results/collected.json
          node scripts/verifyTrialCoverage.mjs collected preflight-results/collected.json
      - name: Install standard WebKit and Chromium
        timeout-minutes: 4
        run: npx playwright install --with-deps webkit chromium
      - name: Run the single 36-case browser gate
        env:
          MOTICOS_TRIAL_BROWSER_APPROVED: '1'
        run: |
          # Keep six minutes for complete bounded evidence packaging and upload.
          remaining=$((1200 - 15 - ($(date +%s) - MOTICOS_JOB_EPOCH) - 360))
          if [ "$remaining" -lt 60 ]; then
            echo "::error::Insufficient browser time remains; no browser rerun is authorized."
            exit 1
          fi
          if [ "$remaining" -gt 600 ]; then remaining=600; fi
          echo "Browser ceiling: ${remaining}s; evidence reserve: 360s"
          npx playwright test --config=playwright.trial.config.js --workers=1 --retries=0 --max-failures=1 --global-timeout="$((remaining * 1000))"
      - name: Prove all 36 cases passed without retries
        run: node scripts/verifyTrialCoverage.mjs completed preflight-results/collected.json trial-test-results/progress/browser-events.jsonl preflight-results/completed-proof.json
      - name: Package all trial screenshots, exports, logs and any first-failure trace
        id: package
        if: always() && steps.checkout.outcome == 'success'
        timeout-minutes: 1
        run: |
          mkdir -p bounded-evidence
          python3 scripts/preserveEvidence.py pack --archive bounded-evidence/trial-evidence.tar.gz --out bounded-evidence/parts --root . --include trial-test-results --include test-results --include preflight-results --chunk-bytes 40894464 --max-parts 5 --github-output "$GITHUB_OUTPUT"
          node scripts/checkTrialEvidenceBudget.mjs
      - name: Preserve bounded evidence part 000
        if: always() && steps.package.outcome == 'success' && steps.package.outputs.part_000 == 'true'
        uses: actions/upload-artifact@v4
        timeout-minutes: 1
        with:
          name: moticos-light-letter-browser-000
          path: |
            bounded-evidence/parts/part-000.bin
            bounded-evidence/parts/manifest.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Preserve bounded evidence part 001
        if: always() && steps.package.outcome == 'success' && steps.package.outputs.part_001 == 'true'
        uses: actions/upload-artifact@v4
        timeout-minutes: 1
        with:
          name: moticos-light-letter-browser-001
          path: |
            bounded-evidence/parts/part-001.bin
            bounded-evidence/parts/manifest.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Preserve bounded evidence part 002
        if: always() && steps.package.outcome == 'success' && steps.package.outputs.part_002 == 'true'
        uses: actions/upload-artifact@v4
        timeout-minutes: 1
        with:
          name: moticos-light-letter-browser-002
          path: |
            bounded-evidence/parts/part-002.bin
            bounded-evidence/parts/manifest.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Preserve bounded evidence part 003
        if: always() && steps.package.outcome == 'success' && steps.package.outputs.part_003 == 'true'
        uses: actions/upload-artifact@v4
        timeout-minutes: 1
        with:
          name: moticos-light-letter-browser-003
          path: |
            bounded-evidence/parts/part-003.bin
            bounded-evidence/parts/manifest.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Preserve bounded evidence part 004
        if: always() && steps.package.outcome == 'success' && steps.package.outputs.part_004 == 'true'
        uses: actions/upload-artifact@v4
        timeout-minutes: 1
        with:
          name: moticos-light-letter-browser-004
          path: |
            bounded-evidence/parts/part-004.bin
            bounded-evidence/parts/manifest.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
