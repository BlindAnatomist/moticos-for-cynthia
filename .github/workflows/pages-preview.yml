name: Temporary Moticos Preview

on:
  push:
    branches:
      - work/fresh-moticos-playable

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: moticos-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build preview
        run: npm run build -- --base=/moticos-for-cynthia/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: moticos-preview
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy temporary preview
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    if: always()
    needs:
      - build
      - deploy
    runs-on: ubuntu-latest
    steps:
      - name: Report preview result on draft PR
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        with:
          script: |
            const success = process.env.BUILD_RESULT === 'success' && process.env.DEPLOY_RESULT === 'success';
            const body = success
              ? `Temporary Moticos preview deployed successfully from commit ${context.sha}.\n\n${process.env.PAGE_URL}`
              : `Temporary Moticos preview failed from commit ${context.sha}. Build: ${process.env.BUILD_RESULT}. Deploy: ${process.env.DEPLOY_RESULT}.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body,
            });
