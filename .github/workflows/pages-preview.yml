name: Temporary Moticos Preview

on:
  push:
    branches:
      - work/fresh-moticos-playable
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: moticos-pages-preview-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build preview
        run: npm run build -- --base=/moticos-for-cynthia/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy temporary preview
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live page and built assets
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          python - <<'PY'
          import os
          import re
          import time
          import urllib.parse
          import urllib.request

          page_url = os.environ["PAGE_URL"]
          if not page_url:
              raise SystemExit("Pages deployment returned no URL")

          last_error = None
          for _ in range(12):
              try:
                  with urllib.request.urlopen(page_url, timeout=20) as response:
                      html = response.read().decode("utf-8")
                  if "<title>Moticos</title>" not in html:
                      raise RuntimeError("Live HTML does not contain the Moticos title")
                  assets = re.findall(r'(?:src|href)="([^"]+/assets/[^"]+)"', html)
                  if not assets:
                      raise RuntimeError("Live HTML contains no built asset references")
                  for asset in assets:
                      asset_url = urllib.parse.urljoin(page_url, asset)
                      with urllib.request.urlopen(asset_url, timeout=20) as response:
                          if response.status != 200:
                              raise RuntimeError(f"Asset returned {response.status}: {asset_url}")
                          response.read(64)
                  print(f"Verified live Moticos preview: {page_url}")
                  break
              except Exception as error:
                  last_error = error
                  time.sleep(5)
          else:
              raise SystemExit(f"Live preview verification failed: {last_error}")
          PY

  report:
    if: always() && github.event_name == 'push'
    needs:
      - build
      - deploy
      - verify-live
    runs-on: ubuntu-latest
    steps:
      - name: Report preview result on draft PR
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify-live.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        with:
          script: |
            const success = process.env.BUILD_RESULT === 'success'
              && process.env.DEPLOY_RESULT === 'success'
              && process.env.VERIFY_RESULT === 'success';
            const body = success
              ? `Temporary Moticos preview deployed and verified from commit ${context.sha}.\n\n${process.env.PAGE_URL}`
              : `Temporary Moticos preview failed from commit ${context.sha}. Build: ${process.env.BUILD_RESULT}. Deploy: ${process.env.DEPLOY_RESULT}. Live verification: ${process.env.VERIFY_RESULT}.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body,
            });
