name: Publish Cynthia Feedback Preview

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/quality.yml

permissions:
  contents: write

concurrency:
  group: moticos-cynthia-feedback-publication
  cancel-in-progress: false

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact publication head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Verify immutable application parent
        run: |
          set -euo pipefail
          expected_parent='cf9d0b114e258839676b76b64962cdd5e159e2cc'
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/quality.yml'

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify and build exact candidate
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          npm run build -- --base=/moticos-for-cynthia/cynthia-feedback-preview/
          printf '%s\n' 'cf9d0b114e258839676b76b64962cdd5e159e2cc' > dist/application-commit.txt

      - name: Publish only the fourth isolated directory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add /tmp/moticos-pages origin/gh-pages
          cd /tmp/moticos-pages

          test "$(git hash-object index.html)" = '71a34b8ed4421f3710c923cdcba91a7231a05254'
          test "$(git hash-object collage-preview/index.html)" = 'fd0c04f55b7429b78ad5d33b7656ee66d0874d84'
          test "$(git hash-object found-composition-preview/index.html)" = 'a7cdf4d4391f614fe0cde49bcde35f1f0f45fc5f'
          test ! -e cynthia-feedback-preview

          cp -R "$GITHUB_WORKSPACE/dist" cynthia-feedback-preview

          unexpected="$(git status --porcelain | grep -v '^?? cynthia-feedback-preview/' || true)"
          test -z "$unexpected"

          git add cynthia-feedback-preview
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --cached --name-only | grep -v '^cynthia-feedback-preview/' || true)"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish isolated Cynthia feedback preview'
          git push origin HEAD:gh-pages

          test "$(git hash-object index.html)" = '71a34b8ed4421f3710c923cdcba91a7231a05254'
          test "$(git hash-object collage-preview/index.html)" = 'fd0c04f55b7429b78ad5d33b7656ee66d0874d84'
          test "$(git hash-object found-composition-preview/index.html)" = 'a7cdf4d4391f614fe0cde49bcde35f1f0f45fc5f'
          test "$(cat cynthia-feedback-preview/application-commit.txt)" = 'cf9d0b114e258839676b76b64962cdd5e159e2cc'

      - name: Install Mobile Safari WebKit
        run: npx playwright install --with-deps webkit

      - name: Verify hosted fourth preview in Mobile Safari WebKit
        run: |
          set -euo pipefail
          url='https://blindanatomist.github.io/moticos-for-cynthia/cynthia-feedback-preview/'
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$url" >/dev/null; then
              break
            fi
            test "$attempt" -lt 30
            sleep 4
          done

          mkdir -p test-results/hosted
          node --input-type=module <<'NODE'
          import { webkit, devices } from '@playwright/test';
          const url = 'https://blindanatomist.github.io/moticos-for-cynthia/cynthia-feedback-preview/';
          const browser = await webkit.launch();
          const context = await browser.newContext({ ...devices['iPhone 13'] });
          const page = await context.newPage();
          const errors = [];
          page.on('console', message => {
            if (message.type() === 'error') errors.push(`console: ${message.text()}`);
          });
          page.on('pageerror', error => errors.push(`page: ${error.message}`));
          await page.goto(url, { waitUntil: 'networkidle' });
          await page.getByRole('heading', { name: 'MOTICOS' }).waitFor();
          const marker = await (await fetch(`${url}application-commit.txt`)).text();
          if (marker.trim() !== 'cf9d0b114e258839676b76b64962cdd5e159e2cc') throw new Error('Wrong hosted application commit');
          if (await page.locator('[data-tier]:not([data-tier="empty"])').count() !== 25) throw new Error('Expected 25 starting pieces');
          if (await page.locator('[data-progression-tier]').count() !== 8) throw new Error('Expected eight progression stages');
          await page.getByRole('button', { name: 'Mute sound effects' }).tap();
          await page.getByRole('button', { name: /From Scraps.*31 merges/ }).tap();
          if (await page.locator('[data-tier="0"]').count() !== 25) throw new Error('From Scraps did not produce 25 Clips');
          await page.getByRole('button', { name: /Found Pieces.*24 merges/ }).tap();
          const first = page.locator('[data-tier="0"]').nth(0);
          const second = page.locator('[data-tier="0"]').nth(1);
          const a = await first.boundingBox();
          const b = await second.boundingBox();
          if (!a || !b) throw new Error('Unable to measure hosted merge pair');
          await page.mouse.move(a.x + a.width / 2, a.y + a.height / 2);
          await page.mouse.down();
          await page.mouse.move(b.x + b.width / 2, b.y + b.height / 2, { steps: 12 });
          await page.mouse.up();
          await page.getByTestId('merges').waitFor();
          if ((await page.getByTestId('merges').textContent())?.trim() !== '1') throw new Error('Hosted merge did not complete');
          if (errors.length) throw new Error(errors.join('\n'));
          await page.screenshot({ path: 'test-results/hosted/cynthia-feedback-preview-iphone.png', fullPage: true });
          await browser.close();
          NODE

      - name: Upload hosted evidence
        uses: actions/upload-artifact@v4
        with:
          name: cynthia-feedback-preview-hosted-evidence
          path: test-results/hosted
          if-no-files-found: error
          retention-days: 1
