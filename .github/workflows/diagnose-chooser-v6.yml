{
  "name": "One focused V6 chooser diagnostic",
  "on": {
    "push": {
      "branches": [
        "diagnostic/chooser-v6-20261006"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "defaults": {
    "run": {
      "shell": "bash"
    }
  },
  "env": {
    "NPM_CONFIG_UPDATE_NOTIFIER": "false",
    "NPM_CONFIG_AUDIT": "false",
    "NPM_CONFIG_FUND": "false"
  },
  "jobs": {
    "diagnose": {
      "if": "github.repository == 'BlindAnatomist/moticos-for-cynthia' && github.ref == 'refs/heads/diagnostic/chooser-v6-20261006' && github.event_name == 'push' && github.run_attempt == 1",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Start strict ten-minute clock",
          "run": "echo \"MOTICOS_CHOOSER_JOB_EPOCH=$(date +%s)\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Check out diagnostic harness",
          "id": "checkout",
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Use exact Node major from V6",
          "id": "node",
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "24"
          }
        },
        {
          "name": "Record real diagnostic identity",
          "id": "identity",
          "run": "node diagnostics/chooser-v6/run.mjs identity"
        },
        {
          "name": "Check out exact original V6 source",
          "id": "frozen",
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "14701d5db89b44a8a935821c455c72c535046d81",
            "path": "frozen-v6",
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Retrieve and authenticate original V6 artifacts",
          "id": "input",
          "timeout-minutes": 2,
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "node diagnostics/chooser-v6/run.mjs retrieve 2>&1 | tee preflight-report/retrieval-command.log"
        },
        {
          "name": "Install exact root lock once",
          "id": "dependencies",
          "timeout-minutes": 1,
          "run": "npm ci --no-audit --no-fund 2>&1 | tee preflight-report/dependency-install.log\nnode scripts/verifyExpansion160Dependencies.mjs preflight-report/diagnostic-dependencies-proof.json > preflight-report/diagnostic-dependencies.log"
        },
        {
          "name": "Verify original source and build, collect one diagnostic case",
          "id": "verify",
          "timeout-minutes": 1,
          "run": "node diagnostics/chooser-v6/run.mjs verify-input 2>&1 | tee preflight-report/input-verification-command.log\nnode diagnostics/chooser-v6/run.mjs collect"
        },
        {
          "name": "Install only locked WebKit",
          "id": "browser_setup",
          "timeout-minutes": 3,
          "run": "./node_modules/.bin/playwright install --with-deps webkit 2>&1 | tee preflight-report/browser-install.log"
        },
        {
          "name": "Run the single diagnostic once",
          "id": "diagnostic",
          "timeout-minutes": 2,
          "env": {
            "MOTICOS_CHOOSER_V6_APPROVED": "1"
          },
          "run": "node diagnostics/chooser-v6/run.mjs run"
        },
        {
          "name": "Preserve complete evidence on success or failure",
          "id": "package",
          "if": "always() && steps.checkout.outcome == 'success'",
          "timeout-minutes": 1,
          "env": {
            "MOTICOS_CHOOSER_STEP_OUTCOMES": "${{ toJSON(steps) }}"
          },
          "run": "node diagnostics/chooser-v6/run.mjs package"
        },
        {
          "name": "Upload the single complete bounded diagnostic artifact",
          "id": "upload",
          "if": "always() && steps.package.outcome == 'success' && steps.package.outputs.complete == 'true'",
          "uses": "actions/upload-artifact@v4",
          "timeout-minutes": 1,
          "with": {
            "name": "moticos-chooser-v6-diagnostic",
            "path": "chooser-evidence/parts/part-000.bin\nchooser-evidence/parts/manifest.json\nchooser-evidence/parts/packaging-proof.json",
            "compression-level": 0,
            "if-no-files-found": "error",
            "retention-days": 1
          }
        },
        {
          "name": "Verify actual native ZIP size and identity",
          "if": "always() && steps.upload.outcome == 'success'",
          "timeout-minutes": 1,
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "MOTICOS_CHOOSER_ARTIFACT_ID": "${{ steps.upload.outputs.artifact-id }}",
            "MOTICOS_CHOOSER_ARTIFACT_DIGEST": "${{ steps.upload.outputs.artifact-digest }}"
          },
          "run": "node diagnostics/chooser-v6/run.mjs verify-upload"
        }
      ]
    }
  }
}
