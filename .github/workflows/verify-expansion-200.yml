          "run": "python3 scripts/assembleExpansion200GateParts.py --downloads .expansion200-downloads --output .expansion200-parts --kind preflight\nbash scripts/prepareExpansion200GateProfile.sh .expansion200-parts \"$PROFILE\"\ncp dependency-install.log preflight-results/dependency-install.log"
        },
        {
          "name": "Install only this profile browser",
          "timeout-minutes": 3,
          "run": "./node_modules/.bin/playwright install --with-deps \"${{ matrix.browser }}\" 2>&1 | tee preflight-results/browser-install.log"
        },
        {
          "name": "Run exactly 33 cases once and verify terminal evidence",
          "id": "browser",
          "env": {
            "MOTICOS_200_BROWSER_APPROVED": "1",
            "PROFILE": "${{ matrix.profile }}"
          },
          "run": "bash scripts/runExpansion200GateProfile.sh \"$PROFILE\""
