            "path": "bounded-evidence/diagnosis.zip",
            "compression-level": 0,
            "if-no-files-found": "error",
            "retention-days": 1
          }
        },
        {
          "name": "Package all raw profile bytes losslessly",
          "id": "package",
          "if": "always() && steps.checkout.outcome == 'success'",
          "timeout-minutes": 1,
          "run": "python3 scripts/expansion200GateEvidence.py pack --source . --kind browser --output bounded-evidence/profile --github-output \"$GITHUB_OUTPUT\"\nnode scripts/verifyExpansion200GateProfileBudget.mjs \"$PROFILE\" bounded-evidence/profile/proof.json",
