          "name": "Upload complete preflight part 000",
          "if": "always() && steps.package.outcome == 'success' && steps.package.outputs.part_000 == 'true'",
          "uses": "actions/upload-artifact@v4",
          "timeout-minutes": 1,
          "with": {
            "name": "moticos-current-preflight-000",
            "path": "bounded-evidence/preflight/parts/part-000.bin\nbounded-evidence/preflight/parts/manifest.json",
            "compression-level": 0,
            "if-no-files-found": "error",
            "retention-days": 1
          },
          "id": "part_000"
        },
        {
          "name": "Upload complete preflight part 001",
          "if": "always() && steps.package.outcome == 'success' && steps.package.outputs.part_001 == 'true'",
