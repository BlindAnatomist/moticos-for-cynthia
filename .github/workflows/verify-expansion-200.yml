    "push": {
      "branches": [
        "verify/current-200-20261007"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "defaults": {
    "run": {
      "shell": "bash"
    }
  },
  "concurrency": {
    "group": "moticos-current-200-20261007",
    "cancel-in-progress": false
