          "timeout-minutes": 1,
          "with": {
            "name": "moticos-current-preflight-001",
            "path": "bounded-evidence/preflight/parts/part-001.bin\nbounded-evidence/preflight/parts/manifest.json",
            "compression-level": 0,
            "if-no-files-found": "error",
            "retention-days": 1
          },
          "id": "part_001"
        },
        {
          "name": "Upload complete preflight part 002",
          "if": "always() && steps.package.outcome == 'success' && steps.package.outputs.part_002 == 'true'",
          "uses": "actions/upload-artifact@v4",
          "timeout-minutes": 1,
          "with": {
            "name": "moticos-current-preflight-002",
            "path": "bounded-evidence/preflight/parts/part-002.bin\nbounded-evidence/preflight/parts/manifest.json",
            "compression-level": 0,
            "if-no-files-found": "error",
            "retention-days": 1
          },
          "id": "part_002"
        },
        {
          "name": "Upload complete preflight part 003",
          "if": "always() && steps.package.outcome == 'success' && steps.package.outputs.part_003 == 'true'",
