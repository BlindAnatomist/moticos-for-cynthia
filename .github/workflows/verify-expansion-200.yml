  "jobs": {
    "build": {
      "if": "github.repository == 'BlindAnatomist/moticos-for-cynthia' && github.ref == 'refs/heads/verify/current-200-20261007' && github.event_name == 'push' && github.run_attempt == 1",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "id": "checkout",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "24"
          }
        },
        {
          "name": "Install exact locked dependencies",
          "timeout-minutes": 1,
          "run": "npm ci --no-audit --no-fund 2>&1 | tee dependency-install.log"
        },
        {
          "name": "Test current behavior and build each variant once",
          "id": "preflight",
          "timeout-minutes": 4,
          "run": "bash scripts/preflightExpansion200Gate.sh 2>&1 | tee ci-preflight.log"
        },
        {
          "name": "Preserve and restore every preflight byte even after failure",
          "id": "package",
          "if": "always() && steps.checkout.outcome == 'success'",
          "timeout-minutes": 2,
          "run": "bash scripts/packageExpansion200GatePreflight.sh"
        },
