name: Recheck matching garden rounds

# Pushing the ordinary work branch is inert. This separate verification branch
# is pushed only after explicit approval of this one bounded Actions run.
on:
  push:
    branches: [verify/matching-collection-recheck-20261004]

permissions:
  contents: read

concurrency:
  group: moticos-matching-collection-recheck
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify matching, input, and preserved game logic
        run: npm test
      - name: Build candidate
        run: npm run build
      - name: Install standard WebKit and Chromium browsers
        run: npx playwright install --with-deps webkit chromium
      - name: Recheck six original-garden full rounds after test-only fixture correction
        run: npx playwright test tests/e2e/matching.spec.js --grep 'full real-UI round' --workers=2 --retries=0
      - name: Keep review evidence for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moticos-matching-collection-recheck-evidence
          path: |
            test-results/screenshots
            test-results/postcards
            test-results/**/trace.zip
            playwright-report
          if-no-files-found: ignore
          retention-days: 1
