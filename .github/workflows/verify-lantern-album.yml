name: Verify Lantern Studio labels and album progression

# Inert until a fresh approval covers this corrected gate and the scoped rescue.
on:
  push:
    branches: [verify/lantern-album-labels-20261005]

permissions:
  contents: read
  actions: read

concurrency:
  group: moticos-lantern-album-labels
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Record the verification time budget
        run: echo "MOTICOS_JOB_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        id: checkout
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recover the exact prior evidence archive without rerunning its tests
        id: recover_prior
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = "BlindAnatomist/moticos-for-cynthia"
          mkdir -p prior-evidence
          gh api --method GET -H "Accept: application/vnd.github+json" "/repos/$GITHUB_REPOSITORY/actions/artifacts/11320307306/zip" > prior-evidence/original.zip
          python3 scripts/preserveEvidence.py split --archive prior-evidence/original.zip --out prior-evidence/parts --expected-bytes 654533926 --expected-sha256 075aae2f23f379516eaae1eff75a88298280fe7452a715c7d0edd06454ffc750 --github-output "$GITHUB_OUTPUT"
      - name: Preserve moticos-prior-37247073900 part 000
        continue-on-error: true
        if: always() && steps.recover_prior.outcome == 'success' && steps.recover_prior.outputs.part_000 == 'true'
        uses: actions/upload-artifact@v4
        timeout-minutes: 1
        with:
          name: moticos-prior-37247073900-000
          path: |
            prior-evidence/parts/part-000.bin
            prior-evidence/parts/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Preserve moticos-prior-37247073900 part 001
        continue-on-error: true
        if: always() && steps.recover_prior.outcome == 'success' && steps.recover_prior.outputs.part_001 == 'true'
        uses: actions/upload-artifact@v4
        timeout-minutes: 1
        with:
          name: moticos-prior-37247073900-001
          path: |
            prior-evidence/parts/part-001.bin
            prior-evidence/parts/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Preserve moticos-prior-37247073900 part 002
        continue-on-error: true
        if: always() && steps.recover_prior.outcome == 'success' && steps.recover_prior.outputs.part_002 == 'true'
        uses: actions/upload-artifact@v4
        timeout-minutes: 1
        with:
          name: moticos-prior-37247073900-002
          path: |
            prior-evidence/parts/part-002.bin
            prior-evidence/parts/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Preserve moticos-prior-37247073900 part 003
        continue-on-error: true
        if: always() && steps.recover_prior.outcome == 'success' && steps.recover_prior.outputs.part_003 == 'true'
        uses: actions/upload-artifact@v4
        timeout-minutes: 1
        with:
          name: moticos-prior-37247073900-003
          path: |
            prior-evidence/parts/part-003.bin
            prior-evidence/parts/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify logic, handlers, labels and evidence packaging
        run: npm test && PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_preserve_evidence.py
      - name: Verify finite inventories and authored content
        run: npm run validate:matching && npm run validate:catalog
      - name: Build isolated candidate
        run: npm run build
      - name: Install standard WebKit and Chromium
        run: npx playwright install --with-deps webkit chromium
      - name: Verify selectors first in all three browser profiles
        env:
          MOTICOS_PROGRESS_DIR: preflight-results/progress
          PLAYWRIGHT_HTML_OUTPUT_DIR: preflight-report
        run: npx playwright test tests/e2e/matching-lantern.spec.js --grep @selector-preflight --workers=2 --retries=0 --max-failures=1 --global-timeout=120000 --output=preflight-results
      - name: Verify the remaining 243 journeys, album and phone-layout cases
        run: |
          # Reserve six minutes for packaging/uploads inside the same job cap.
          # Account for all elapsed rescue, setup and preflight time, plus a
          # conservative allowance for runner setup before our first step.
          remaining=$((2100 - 15 - ($(date +%s) - MOTICOS_JOB_EPOCH) - 360))
          if [ "$remaining" -lt 60 ]; then
            echo "::error::Insufficient verification time remains after reserving evidence preservation."
            exit 1
          fi
          if [ "$remaining" -gt 1500 ]; then remaining=1500; fi
          echo "Main browser ceiling: ${remaining}s; evidence reserve: 360s"
          npx playwright test tests/e2e/matching.spec.js tests/e2e/matching-expansion.spec.js tests/e2e/matching-riverside.spec.js tests/e2e/matching-lantern.spec.js tests/e2e/matching-layout.spec.js --grep-invert @selector-preflight --workers=2 --retries=0 --global-timeout="$((remaining * 1000))"
      - name: Package every browser evidence file into bounded parts
        id: package
        if: always() && steps.checkout.outcome == 'success'
        timeout-minutes: 3
        run: |
          mkdir -p bounded-evidence
          python3 scripts/preserveEvidence.py pack --archive bounded-evidence/browser-evidence.tar.gz --out bounded-evidence/parts --root . --include test-results --include playwright-report --include preflight-results --include preflight-report --github-output "$GITHUB_OUTPUT"
      - name: Preserve moticos-lantern-label-browser part 000
        if: always() && steps.package.outcome == 'success' && steps.package.outputs.part_000 == 'true'
        uses: actions/upload-artifact@v4
        timeout-minutes: 1
        with:
          name: moticos-lantern-label-browser-000
          path: |
            bounded-evidence/parts/part-000.bin
            bounded-evidence/parts/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Preserve moticos-lantern-label-browser part 001
        if: always() && steps.package.outcome == 'success' && steps.package.outputs.part_001 == 'true'
        uses: actions/upload-artifact@v4
        timeout-minutes: 1
