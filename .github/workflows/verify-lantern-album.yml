name: Complete the remaining Lantern Studio verification

# This branch starts exactly one explicitly approved 76-case continuation.
on:
  push:
    branches: [verify/lantern-album-remaining-20261005]

permissions:
  contents: read

concurrency:
  group: moticos-lantern-album-remaining
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Record the verification time budget
        run: echo "MOTICOS_JOB_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        id: checkout
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Check continuation guard and unchanged runtime identity
        run: npx vitest run tests/remainingCoverage.test.js
      - name: Collect and prove the exact remaining identity set without running browsers
        run: |
          mkdir -p preflight-results
          npx playwright test tests/e2e/matching.spec.js tests/e2e/matching-expansion.spec.js tests/e2e/matching-riverside.spec.js tests/e2e/matching-lantern.spec.js tests/e2e/matching-layout.spec.js --list --reporter=json > preflight-results/all-collected.json
          npx playwright test --test-list=tests/verification/lantern-remaining-tests.txt --list --reporter=json > preflight-results/remaining-collected.json
          node scripts/verifyRemainingCoverage.mjs collected preflight-results/all-collected.json preflight-results/remaining-collected.json preflight-results/collection-proof.json
      - name: Build the unchanged candidate
        run: npm run build
      - name: Install standard WebKit and Chromium
        run: npx playwright install --with-deps webkit chromium
      - name: Run only the 76 unfinished cases with no retries
        run: |
          # Keep six minutes for evidence preservation within the 25-minute cap.
          remaining=$((1500 - 15 - ($(date +%s) - MOTICOS_JOB_EPOCH) - 360))
          if [ "$remaining" -lt 60 ]; then
            echo "::error::Insufficient browser time remains after reserving evidence preservation."
            exit 1
          fi
          if [ "$remaining" -gt 900 ]; then remaining=900; fi
          echo "Continuation browser ceiling: ${remaining}s; evidence reserve: 360s"
          npx playwright test --test-list=tests/verification/lantern-remaining-tests.txt --workers=2 --retries=0 --global-timeout="$((remaining * 1000))"
      - name: Prove all 246 distinct cases passed across the unchanged source
        run: node scripts/verifyRemainingCoverage.mjs completed test-results/progress/browser-events.jsonl preflight-results/completed-union-proof.json
      - name: Package every browser evidence file into bounded parts
        id: package
        if: always() && steps.checkout.outcome == 'success'
        timeout-minutes: 3
        run: |
          mkdir -p bounded-evidence
          python3 scripts/preserveEvidence.py pack --archive bounded-evidence/browser-evidence.tar.gz --out bounded-evidence/parts --root . --include test-results --include playwright-report --include preflight-results --include preflight-report --github-output "$GITHUB_OUTPUT"
      - name: Preserve moticos-lantern-completion-browser part 000
        if: always() && steps.package.outcome == 'success' && steps.package.outputs.part_000 == 'true'
        uses: actions/upload-artifact@v4
        timeout-minutes: 1
        with:
          name: moticos-lantern-completion-browser-000
          path: |
            bounded-evidence/parts/part-000.bin
            bounded-evidence/parts/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Preserve moticos-lantern-completion-browser part 001
        if: always() && steps.package.outcome == 'success' && steps.package.outputs.part_001 == 'true'
        uses: actions/upload-artifact@v4
        timeout-minutes: 1
