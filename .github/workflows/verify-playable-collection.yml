name: Verify authored-art playable collection

on:
  push:
    branches:
      - verify/moticos-collection-20261004
    paths:
      - .github/workflows/verify-playable-collection.yml

permissions:
  contents: read

concurrency:
  group: moticos-playable-collection-20261004
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact reviewed implementation
        uses: actions/checkout@v4
        with:
          ref: e4bce216fb29e322140971ca18b8aedf9fb338c5
          persist-credentials: false

      - name: Verify checkpoint identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e4bce216fb29e322140971ca18b8aedf9fb338c5"
          test "$(git rev-parse HEAD^{tree})" = "7639911bac9d3a8b44c92627d1fac1196384ef29"
          echo "87024cf798a4b1f18febace90041a9580c9391ec788028966264181f3a0b0869  package-lock.json" | sha256sum -c -

      - name: Use verified Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run original and collection logic tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Install Mobile Safari WebKit and desktop Chromium
        run: npx playwright install --with-deps webkit chromium

      - name: Run bounded browser verification and capture evidence
        run: npm run test:e2e -- --workers=1 --retries=0

      - name: Preserve screenshots, real postcard exports, and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moticos-playable-collection-evidence
          path: |
            test-results/screenshots
            test-results/postcards
            test-results/**/trace.zip
            playwright-report
          if-no-files-found: ignore
          retention-days: 1
