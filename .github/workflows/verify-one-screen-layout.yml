name: Verify one-screen Moticos layout

# Inert until the owner separately approves this bounded browser gate.
on:
  push:
    branches: [verify/one-screen-layout-20261004]

permissions:
  contents: read

concurrency:
  group: moticos-one-screen-layout
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify engines, handlers and save protection
        run: npm test
      - name: Verify finite inventories
        run: npm run validate:matching
      - name: Build isolated candidate
        run: npm run build
      - name: Install standard WebKit and Chromium
        run: npx playwright install --with-deps webkit chromium
      - name: Verify existing journeys and exact one-screen layouts
        run: npx playwright test tests/e2e/matching.spec.js tests/e2e/matching-expansion.spec.js tests/e2e/matching-riverside.spec.js tests/e2e/matching-layout.spec.js --workers=2 --retries=0
      - name: Keep browser evidence for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moticos-one-screen-layout-evidence
          path: |
            test-results/screenshots
            test-results/geometry
            test-results/postcards
            test-results/**/trace.zip
            playwright-report
          if-no-files-found: ignore
          retention-days: 1
