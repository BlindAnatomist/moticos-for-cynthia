      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies once
        run: npm install --no-audit --no-fund

      - name: Run deterministic game-logic tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Install Mobile Safari WebKit and desktop Chromium
        run: npx playwright install --with-deps webkit chromium

      - name: Run iPhone-first browser tests and capture screenshots
        run: npm run test:e2e

      - name: Commit the verified candidate and remove this one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-found-composition.yml
          git add src tests
          git commit -m "Implement five-by-five found-composition sessions"
          git push origin HEAD:work/generative-collage-iteration

      - name: Upload screenshots, postcards, and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moticos-found-composition-evidence
          path: |
            test-results/screenshots
            test-results/postcards
            test-results/**/trace.zip
            playwright-report
          if-no-files-found: ignore
          retention-days: 1
